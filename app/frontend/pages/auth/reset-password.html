<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Animasi Canvas Sederhana</title>
<style>
    body {
        background-color: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    canvas {
        background-color: #fff;
        border: 2px solid #000;
    }
</style>
</head>
<body>

<canvas id="myCanvas" width="500" height="300"></canvas>

<script>
// Ambil elemen canvas dan context 2D
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// Posisi awal bola
let x = canvas.width / 2;
let y = canvas.height / 2;

// Kecepatan bola
let dx = 2;
let dy = 2;

// Radius bola
const radius = 20;

// Fungsi menggambar bola
function drawBall() {
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();
}

// Fungsi utama animasi
function draw() {
    // Bersihkan canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Gambar bola
    drawBall();

    // Deteksi tabrakan dengan dinding
    if (x + dx > canvas.width - radius || x + dx < radius) {
        dx = -dx;
    }
    if (y + dy > canvas.height - radius || y + dy < radius) {
        dy = -dy;
    }

    // Update posisi bola
    x += dx;
    y += dy;

    // Panggil ulang fungsi draw setiap frame
    requestAnimationFrame(draw);
}

// Jalankan animasi
draw();
</script>

</body>
</html>
