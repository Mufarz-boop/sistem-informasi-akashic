<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f1f1f1">
  <title>Maaf, terjadi gangguan | Akashic</title>

  <style>
    /* AKASHIC — HTTP 500 (monokrom). Halaman standalone; semua class berawalan akashic-500. */
    :root {
      --akashic-500-bg: #f1f1f1;
      --akashic-500-black: #0f0f0f;
      --akashic-500-ink: #1a1a1a;
      --akashic-500-grey: #8a8a8a;
      --akashic-500-muted: #5a5a5a;
      --akashic-500-line: rgba(15, 15, 15, 0.1);
      --akashic-500-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --akashic-500-serif: Georgia, "Times New Roman", Times, serif;
      --akashic-500-sans: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--akashic-500-bg);
      color: var(--akashic-500-ink);
      font-family: var(--akashic-500-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Latar: video hitam-putih (gambar sebagai cadangan) ---------- */
    .akashic-500__bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
      background: var(--akashic-500-bg) center / cover no-repeat;
      filter: grayscale(1) contrast(1.05);
      animation: akashic-500-fade 1400ms var(--akashic-500-ease) both;
    }

    .akashic-500__video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Lapisan terang agar teks tetap terbaca di atas video apa pun */
    .akashic-500__bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(241, 241, 241, 0.9) 0%, rgba(241, 241, 241, 0.58) 100%),
        radial-gradient(ellipse 90% 80% at 50% 50%, rgba(241, 241, 241, 0) 40%, rgba(241, 241, 241, 0.5) 100%);
    }

    /* Grid tipis */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--akashic-500-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--akashic-500-line) 1px, transparent 1px);
      background-size: 76px 76px;
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 15%, transparent 78%);
      mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 15%, transparent 78%);
    }

    /* ---------- Layout ---------- */
    .akashic-500 {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: clamp(18px, 2.6vw, 36px) clamp(20px, 5vw, 64px);
    }

    .akashic-500__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }

    .akashic-500__brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; border-radius: 6px; }
    .akashic-500__brand-mark { width: 26px; height: 26px; flex: none; }
    .akashic-500__brand-text { display: flex; flex-direction: column; gap: 3px; }

    .akashic-500__wordmark {
      font-family: var(--akashic-500-serif);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1;
      color: var(--akashic-500-black);
    }

    .akashic-500__tagline,
    .akashic-500__code {
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--akashic-500-muted);
      line-height: 1.4;
    }

    .akashic-500__code { text-align: right; }
    .akashic-500__code strong {
      display: block;
      font-family: var(--akashic-500-serif);
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      color: var(--akashic-500-black);
    }

    .akashic-500__main {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      align-items: center;
      column-gap: clamp(32px, 6vw, 88px);
      padding: clamp(24px, 5vh, 56px) 0;
    }

    /* ---------- Angka 500: geometris, hitam-putih-abu-abu ---------- */
    .akashic-500__illustration { width: 100%; max-width: 640px; }

    .akashic-500__number {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      user-select: none;
      -webkit-user-select: none;
      animation: akashic-500-rise 1000ms var(--akashic-500-ease) 200ms both;
    }

    .akashic-500__layer { fill: none; stroke-linecap: butt; stroke-linejoin: miter; }

    /* Bayangan datar abu-abu, bergeser tegas (tanpa blur) */
    .akashic-500__shadow { stroke: rgba(15, 15, 15, 0.16); stroke-width: 30; }

    /* Garis kontur tipis abu-abu di belakang angka */
    .akashic-500__contour { stroke: var(--akashic-500-grey); stroke-width: 1.5; stroke-dasharray: 3 6; }

    /* Angka solid hitam */
    .akashic-500__solid { stroke: var(--akashic-500-black); stroke-width: 30; }

    /* Angka garis tepi: tepi hitam, isi putih */
    .akashic-500__edge { stroke: var(--akashic-500-black); stroke-width: 36; }
    .akashic-500__fill { stroke: #fff; stroke-width: 22; }

    .akashic-500__draw {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: akashic-500-draw 1500ms var(--akashic-500-ease) both;
    }
    .akashic-500__draw--1 { animation-delay: 350ms; }
    .akashic-500__draw--2 { animation-delay: 700ms; }
    .akashic-500__draw--3 { animation-delay: 1050ms; }

    .akashic-500__pin { opacity: 0; animation: akashic-500-fade 700ms var(--akashic-500-ease) 1.8s both; }

    .akashic-500__ping {
      fill: none;
      stroke: var(--akashic-500-black);
      stroke-width: 1.5;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: akashic-500-ping 3.4s cubic-bezier(0.2, 0.6, 0.3, 1) 2s infinite;
    }
    .akashic-500__ping--b { animation-delay: 3.1s; }

    /* Garis tanda kecil (skala teknis) */
    .akashic-500__tick { stroke: var(--akashic-500-grey); stroke-width: 1.5; fill: none; }

    /* Glitch singkat sesekali (kesan gangguan) */
    .akashic-500__glitch {
      fill: none;
      stroke: var(--akashic-500-grey);
      stroke-width: 30;
      opacity: 0;
      animation: akashic-500-glitch 7s steps(1, end) 3s infinite;
    }

    /* ---------- Teks ---------- */
    .akashic-500__content { max-width: 32rem; }

    .akashic-500__title {
      margin: 0 0 clamp(18px, 3vh, 28px);
      font-family: var(--akashic-500-serif);
      font-weight: 400;
      font-size: clamp(2.4rem, 4.8vw, 4.3rem);
      line-height: 1.06;
      letter-spacing: -0.02em;
      color: var(--akashic-500-black);
      animation: akashic-500-rise 900ms var(--akashic-500-ease) 450ms both;
    }
    .akashic-500__title span { display: block; margin-top: 0.1em; color: var(--akashic-500-grey); }

    .akashic-500__message { animation: akashic-500-rise 900ms var(--akashic-500-ease) 600ms both; }
    .akashic-500__message p {
      margin: 0 0 0.7em;
      font-family: var(--akashic-500-serif);
      font-size: clamp(1.02rem, 1.4vw, 1.18rem);
      line-height: 1.65;
      color: var(--akashic-500-muted);
    }
    .akashic-500__message p:last-child { margin-bottom: 0; }

    .akashic-500__actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 28px;
      margin-top: clamp(24px, 4vh, 40px);
      animation: akashic-500-rise 900ms var(--akashic-500-ease) 750ms both;
    }

    .akashic-500__cta {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      padding: 0 26px;
      border-radius: 999px;
      background: var(--akashic-500-black);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
      transition: background 260ms var(--akashic-500-ease), text-decoration-color 260ms var(--akashic-500-ease);
      -webkit-tap-highlight-color: transparent;
    }
    .akashic-500__cta svg { width: 18px; height: 18px; flex: none; transition: transform 320ms var(--akashic-500-ease); }
    .akashic-500__cta:hover { background: #2b2b2b; text-decoration-color: #fff; }
    .akashic-500__cta:hover svg { transform: translateX(5px); }

    .akashic-500__retry {
      appearance: none;
      background: none;
      border: 0;
      padding: 12px 2px;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--akashic-500-muted);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 6px;
      transition: color 260ms var(--akashic-500-ease), text-decoration-color 260ms var(--akashic-500-ease);
    }
    .akashic-500__retry[hidden] { display: none; }
    .akashic-500__retry:hover { color: var(--akashic-500-black); text-decoration-color: currentColor; }
    .akashic-500__retry:disabled { cursor: progress; opacity: 0.7; }

    .akashic-500__cta:focus-visible,
    .akashic-500__retry:focus-visible,
    .akashic-500__brand:focus-visible {
      outline: 3px solid var(--akashic-500-black);
      outline-offset: 4px;
    }

    .akashic-500__meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(15, 15, 15, 0.16);
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #595959;
      animation: akashic-500-fade 900ms var(--akashic-500-ease) 800ms both;
    }

    /* ---------- Keyframes ---------- */
    @keyframes akashic-500-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes akashic-500-rise { from { opacity: 0; transform: translate3d(0, 16px, 0); } to { opacity: 1; transform: none; } }
    @keyframes akashic-500-draw { to { stroke-dashoffset: 0; } }
    @keyframes akashic-500-ping {
      0%   { opacity: 0;   transform: scale(0.25); }
      15%  { opacity: 0.7; }
      100% { opacity: 0;   transform: scale(1); }
    }
    @keyframes akashic-500-glitch {
      0%, 100% { opacity: 0;    transform: none; }
      90%      { opacity: 0.5;  transform: translate3d(-7px, 2px, 0); }
      92%      { opacity: 0.5;  transform: translate3d(6px, -2px, 0); }
      94%      { opacity: 0.3;  transform: translate3d(-3px, 0, 0); }
      96%      { opacity: 0;    transform: none; }
    }

    /* Jeda animasi saat tab tidak terlihat */
    .akashic-500-paused *, .akashic-500-paused *::before, .akashic-500-paused *::after {
      animation-play-state: paused !important;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 880px) {
      .akashic-500__main { grid-template-columns: minmax(0, 1fr); row-gap: clamp(12px, 3vh, 28px); padding: 20px 0 32px; }
      .akashic-500__illustration { justify-self: center; max-width: min(460px, 100%); }
      .akashic-500__content { justify-self: center; max-width: 34rem; width: 100%; }
      .akashic-500__bg::after { background: linear-gradient(180deg, rgba(241, 241, 241, 0.76) 0%, rgba(241, 241, 241, 0.92) 100%); }
    }

    @media (max-width: 520px) {
      .akashic-500__tagline { display: none; }
      .akashic-500__actions { flex-direction: column; align-items: stretch; gap: 6px; }
      .akashic-500__cta { justify-content: space-between; min-height: 56px; }
      .akashic-500__retry { align-self: center; }
      .akashic-500__meta { flex-direction: column; gap: 4px; }
    }

    @media (max-height: 640px) and (min-width: 881px) {
      .akashic-500__main { padding: 12px 0; }
      .akashic-500__illustration { max-width: 500px; }
    }

    /* ---------- Reduced motion: tanpa animasi; video dijeda lewat JavaScript ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .akashic-500__draw { stroke-dashoffset: 0 !important; }
      .akashic-500__pin { opacity: 1 !important; }
    }
  </style>
</head>

<body>
  <!-- Latar video (diubah ke hitam-putih lewat CSS). Gambar tampil jika video gagal, belum siap, atau gerak dikurangi. -->
  <div class="akashic-500__bg" aria-hidden="true" style="background-image: url('{{ url_for('static', filename='image/gambar-02.jpg') }}');">
    <video class="akashic-500__video" id="akashic-500-video"
           autoplay muted loop playsinline preload="auto" disablepictureinpicture tabindex="-1"
           poster="{{ url_for('static', filename='image/gambar-02.jpg') }}">
      <source src="{{ url_for('static', filename='video/animasi-02.mp4') }}" type="video/mp4">
    </video>
  </div>

  <div class="akashic-500">

    <header class="akashic-500__header">
      <a class="akashic-500__brand" href="{{ url_for('index') }}" aria-label="Akashic, kembali ke beranda">
        <svg class="akashic-500__brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path d="M16 3.5c-5.2 0-9.2 4-9.2 9 0 6.6 9.2 16 9.2 16s9.2-9.4 9.2-16c0-5-4-9-9.2-9Z" fill="#0f0f0f"/>
          <circle cx="16" cy="12.5" r="3.6" fill="#ffffff"/>
        </svg>
        <span class="akashic-500__brand-text">
          <span class="akashic-500__wordmark">AKASHIC</span>
          <span class="akashic-500__tagline">Location-Based Information System</span>
        </span>
      </a>
      <div class="akashic-500__code">HTTP <strong>500</strong></div>
    </header>

    <main class="akashic-500__main" id="main">

      <div class="akashic-500__illustration">
        <svg class="akashic-500__number" viewBox="0 0 590 250" aria-hidden="true" focusable="false">
          <defs>
            <!-- Bentuk geometris angka (garis tengah); dipakai ulang di tiap lapisan -->
            <path id="akashic-500-five" pathLength="1" d="M164 36H62V112H112A48 48 0 0 1 112 208H44"/>
            <rect id="akashic-500-zero-a" pathLength="1" x="220" y="34" width="130" height="172" rx="65"/>
            <rect id="akashic-500-zero-b" pathLength="1" x="415" y="34" width="130" height="172" rx="65"/>
          </defs>

          <!-- Skala teknis di bawah angka -->
          <path class="akashic-500__tick" d="M14 236H576M14 230V242M110 233V239M206 233V239M302 230V242M398 233V239M494 233V239M576 230V242"/>

          <!-- 5: solid hitam -->
          <g class="akashic-500__draw akashic-500__draw--1">
            <g transform="translate(14 14)">
              <use class="akashic-500__layer akashic-500__shadow" href="#akashic-500-five"/>
              <use class="akashic-500__layer akashic-500__contour" href="#akashic-500-five" style="stroke-dasharray:3 6"/>
            </g>
            <use class="akashic-500__layer akashic-500__solid" href="#akashic-500-five"/>
          </g>

          <!-- 0 tengah: garis tepi hitam, isi putih -->
          <g class="akashic-500__draw akashic-500__draw--2">
            <g transform="translate(14 14)">
              <use class="akashic-500__layer akashic-500__shadow" href="#akashic-500-zero-a"/>
            </g>
            <use class="akashic-500__layer akashic-500__edge" href="#akashic-500-zero-a"/>
            <use class="akashic-500__layer akashic-500__fill" href="#akashic-500-zero-a"/>
          </g>

          <!-- Titik lokasi dan radar di dalam angka 0 tengah -->
          <circle class="akashic-500__ping" cx="285" cy="120" r="46"/>
          <circle class="akashic-500__ping akashic-500__ping--b" cx="285" cy="120" r="46"/>
          <circle class="akashic-500__pin" cx="285" cy="120" r="10" fill="#0f0f0f"/>

          <!-- 0 kanan: solid hitam -->
          <g class="akashic-500__draw akashic-500__draw--3">
            <g transform="translate(14 14)">
              <use class="akashic-500__layer akashic-500__shadow" href="#akashic-500-zero-b"/>
            </g>
            <use class="akashic-500__layer akashic-500__solid" href="#akashic-500-zero-b"/>
          </g>

          <g class="akashic-500__glitch">
            <use href="#akashic-500-five"/><use href="#akashic-500-zero-a"/><use href="#akashic-500-zero-b"/>
          </g>
        </svg>
      </div>

      <div class="akashic-500__content">
        <h1 class="akashic-500__title">
          Maaf...
          <span>Ini bukan salahmu.</span>
        </h1>

        <div class="akashic-500__message">
          <p>Sistem kami sedang mengalami masalah internal pada server.</p>
          <p>Coba kembali beberapa saat lagi.</p>
        </div>

        <div class="akashic-500__actions">
          <a class="akashic-500__cta" href="{{ url_for('index') }}">
            <span>Kembali ke Akashic</span>
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10h13M11 4.5 16.5 10 11 15.5"/></svg>
          </a>
          <button class="akashic-500__retry" type="button" id="akashic-500-retry" hidden>Coba lagi</button>
        </div>
      </div>
    </main>

    <footer class="akashic-500__meta" aria-hidden="true">
      <span>Akashic / Internal Server Error / 500</span>
      <span>System status: sementara tidak tersedia</span>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      'use strict';

      const root = document.documentElement;
      const retry = document.getElementById('akashic-500-retry');
      const video = document.getElementById('akashic-500-video');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      // Tombol "Coba lagi" hanya tampil jika JavaScript aktif
      if (retry) {
        retry.hidden = false;
        retry.addEventListener('click', () => {
          retry.textContent = 'Memuat ulang...';
          retry.setAttribute('aria-busy', 'true');
          retry.disabled = true;
          window.location.reload();
        });
      }

      // Video hanya diputar saat tab terlihat dan pengguna tidak meminta gerak dikurangi
      const syncVideo = () => {
        if (!video) return;
        if (document.hidden || reduceMotion.matches) { video.pause(); return; }
        const attempt = video.play();
        if (attempt && attempt.catch) attempt.catch(() => {});
      };

      // Jika file video gagal dimuat, sembunyikan elemen video agar gambar latar tetap terlihat
      if (video) video.addEventListener('error', () => { video.hidden = true; }, true);

      const syncVisibility = () => {
        root.classList.toggle('akashic-500-paused', document.hidden);
        syncVideo();
      };

      document.addEventListener('visibilitychange', syncVisibility);
      if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', syncVideo);
      syncVisibility();
    });
  </script>
</body>
</html>
