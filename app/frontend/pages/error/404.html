<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="description" content="Akashic — Halaman yang kamu cari tidak ditemukan.">
<meta name="theme-color" content="#111417">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='image/icon-akashic.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='image/icon-akashic.png') }}">
<title>404</title>
<style>
.akashic-404{
  --a4-bg:#111417;--a4-ivory:#F2EFE8;--a4-muted:#8C9295;--a4-accent:#B86B43;--a4-blue:#5D8494;
  --a4-line:rgba(255,255,255,.10);--a4-line2:rgba(255,255,255,.22);--a4-glass:rgba(23,27,31,.55);
  --a4-sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --a4-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --a4-ease:cubic-bezier(.22,1,.36,1);
  --a4-mx:0;--a4-my:0;
}

/* Scrollbar tersembunyi, scroll tetap berfungsi */
html{background:#111417;overflow-y:scroll;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}
body{margin:0;background:#CBC7BF;padding:clamp(8px,2vw,28px);overflow-x:hidden;scrollbar-width:none}

.akashic-404,.akashic-404 *,.akashic-404 *::before,.akashic-404 *::after{box-sizing:border-box}
.akashic-404 :is(h1,p){margin:0}
.akashic-404 a{color:inherit;text-decoration:none}
.akashic-404 :focus-visible{outline:2px solid var(--a4-accent);outline-offset:4px;border-radius:4px}
.akashic-404 .a4-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Stage */
.akashic-404{
  position:relative;width:100%;max-width:1440px;margin:0 auto;
  min-height:calc(100vh - clamp(16px,4vw,56px));min-height:calc(100svh - clamp(16px,4vw,56px));
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;isolation:isolate;
  padding:0 clamp(20px,4vw,56px);
  background:var(--a4-bg);color:var(--a4-ivory);font-family:var(--a4-sans);
  border-radius:clamp(10px,2vw,24px);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 30px 70px -30px rgba(17,20,23,.6);
  -webkit-font-smoothing:antialiased;
}

/* Background layers */
.akashic-404__fallback{position:absolute;inset:-3%;z-index:0;pointer-events:none;
  background:radial-gradient(60% 50% at 70% 35%,rgba(184,107,67,.16),transparent 70%),radial-gradient(50% 45% at 20% 80%,rgba(93,132,148,.18),transparent 70%),#111417;
  transform:translate3d(calc(var(--a4-mx)*-3px),calc(var(--a4-my)*-3px),0)}
.akashic-404__video{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;
  filter:grayscale(.9) contrast(1.1) brightness(.55);mix-blend-mode:luminosity;
  transform:translate3d(calc(var(--a4-mx)*-6px),calc(var(--a4-my)*-6px),0) scale(1.04);transition:opacity 1.8s var(--a4-ease)}
.akashic-404--video .akashic-404__video{opacity:.55}
.akashic-404--novideo .akashic-404__video{display:none}
.akashic-404__overlay{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(90% 70% at 50% 45%,transparent 30%,rgba(17,20,23,.85) 100%),linear-gradient(180deg,rgba(17,20,23,.5),rgba(17,20,23,.2) 40%,rgba(17,20,23,.7))}
.akashic-404__grid{position:absolute;inset:0;z-index:3;pointer-events:none;
  background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);
  transform:translate3d(calc(var(--a4-mx)*3px),calc(var(--a4-my)*3px),0)}

/* Header */
.akashic-404__header{position:relative;z-index:7;padding-top:clamp(20px,3vw,32px);animation:akashic-404-rise 1s var(--a4-ease) .2s both;--a4-y:-10px}
.akashic-404__header-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--a4-line)}
.akashic-404__brand{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:.32em}
.akashic-404__brand :is(svg,img){width:26px;height:26px;object-fit:contain}
.akashic-404__meta{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid var(--a4-line2);border-radius:999px;background:var(--a4-glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:11px/1 var(--a4-mono);letter-spacing:.12em;color:var(--a4-muted)}
.akashic-404__meta b{color:var(--a4-ivory);font-weight:600}
.akashic-404__meta i{width:7px;height:7px;border-radius:50%;background:var(--a4-accent);animation:akashic-404-pulse 2.4s ease-in-out infinite}

/* Content */
.akashic-404__content{position:relative;z-index:7;display:grid;place-items:center;align-content:center;text-align:center;padding:32px 0}
.akashic-404__statement{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid var(--a4-line2);border-radius:999px;background:var(--a4-glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--a4-muted);
  animation:akashic-404-rise 1.1s var(--a4-ease) .4s both;--a4-y:14px}
.akashic-404__statement::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--a4-accent)}
.akashic-404__lead{margin-top:18px;font-size:clamp(1.1rem,2.2vw,1.6rem);font-weight:500;letter-spacing:-.02em;color:var(--a4-ivory);animation:akashic-404-rise 1.1s var(--a4-ease) .5s both;--a4-y:14px}
.akashic-404__depth{transform:translate3d(calc(var(--a4-mx)*8px),calc(var(--a4-my)*8px),0)}
.akashic-404__code{font-weight:700;font-size:clamp(7rem,28vw,24rem);line-height:.85;letter-spacing:-.06em;margin:.04em 0;user-select:none;
  background:linear-gradient(180deg,var(--a4-ivory) 10%,rgba(242,239,232,.08) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 40px rgba(184,107,67,.18));
  animation:akashic-404-rise 1.6s var(--a4-ease) .65s both,akashic-404-breathe 11s ease-in-out 2.2s infinite;--a4-y:30px}

/* CTA — teks diubah menjadi cokelat tua agar selaras dengan aksen tombol */
.akashic-404__cta{display:inline-flex;align-items:center;gap:14px;min-height:52px;padding:0 26px 0 22px;margin-top:24px;border-radius:999px;background:var(--a4-ivory);color:#6B3A1F;
  font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;box-shadow:inset 0 -2px 0 var(--a4-accent);
  animation:akashic-404-rise 1.1s var(--a4-ease) 1s both;--a4-y:12px;transition:background-color .3s,color .3s,transform .4s var(--a4-ease)}
.akashic-404__cta svg{width:18px;height:18px;transition:transform .45s var(--a4-ease)}
.akashic-404__cta:hover{background:#fff;color:#4E2A14;transform:translateY(-2px)}
.akashic-404__cta:hover svg{transform:translateX(-5px)}

/* Footer */
.akashic-404__footer{position:relative;z-index:7;padding-bottom:clamp(20px,3vw,32px);transform:translate3d(calc(var(--a4-mx)*4px),calc(var(--a4-my)*4px),0)}
.akashic-404__footer-row{display:flex;justify-content:space-between;gap:24px;padding-top:18px;border-top:1px solid var(--a4-line);font:10px/1.9 var(--a4-mono);letter-spacing:.14em;color:var(--a4-muted);animation:akashic-404-fade 1.4s var(--a4-ease) 1.2s both}
.akashic-404__footer-row p:last-child{text-align:right}
.akashic-404__footer-row b{color:var(--a4-ivory);font-weight:600}

@keyframes akashic-404-fade{from{opacity:0}to{opacity:1}}
@keyframes akashic-404-rise{from{opacity:0;transform:translate3d(0,var(--a4-y,16px),0)}to{opacity:1;transform:none}}
@keyframes akashic-404-breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.008);opacity:.92}}
@keyframes akashic-404-pulse{0%,100%{box-shadow:0 0 0 0 rgba(184,107,67,.5)}50%{box-shadow:0 0 0 6px rgba(184,107,67,0)}}

@media (max-width:768px){
  body{padding:0}
  .akashic-404{max-width:none;min-height:100vh;min-height:100svh;border-radius:0;box-shadow:none}
  .akashic-404__grid{background-size:44px 44px}
  .akashic-404__cta{width:100%;max-width:320px;justify-content:center}
}
@media (max-width:520px){
  .akashic-404__meta span{display:none}
  .akashic-404__footer-row{font-size:9px;letter-spacing:.1em}
}
@media (max-width:360px){.akashic-404__code{font-size:6.5rem}}

/* Reduced motion (override: FORCE_MOTION di JavaScript) */
@media (prefers-reduced-motion:reduce){
  .akashic-404:not(.akashic-404--force) *,.akashic-404:not(.akashic-404--force) *::before,.akashic-404:not(.akashic-404--force) *::after{animation:none!important;transition:none!important}
  .akashic-404:not(.akashic-404--force) :is(.akashic-404__fallback,.akashic-404__grid,.akashic-404__depth,.akashic-404__footer){transform:none!important}
  .akashic-404:not(.akashic-404--force) .akashic-404__video{transform:scale(1.04)!important}
}
</style>
</head>
<body>
<div class="akashic-404" id="akashic404">

  <div class="akashic-404__fallback" aria-hidden="true"></div>
  <video class="akashic-404__video" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1">
    <source src="{{ url_for('static', filename='video/animasi-01.mp4') }}" type="video/mp4">
  </video>
  <div class="akashic-404__overlay" aria-hidden="true"></div>
  <div class="akashic-404__grid" aria-hidden="true"></div>

  <header class="akashic-404__header">
    <div class="akashic-404__header-row">
      <div>
        <p class="akashic-404__brand">
          <img src="{{ url_for('static', filename='image/icon-akashic.png') }}" alt="" width="26" height="26" decoding="async">
          AKASHIC
        </p>
      </div>
      <p class="akashic-404__meta"><i aria-hidden="true"></i><b>NO. 404</b><span>ERROR ARCHIVE</span></p>
    </div>
  </header>

  <main class="akashic-404__content">
    <section aria-labelledby="akashic404Title">
      <p class="akashic-404__statement">Halaman tidak ditemukan</p>
      <p class="akashic-404__lead">Periksa kembali alamat yang kamu tuju.</p>
      <div class="akashic-404__depth">
        <h1 class="akashic-404__code" id="akashic404Title">404<span class="a4-sr"> — Halaman tidak ditemukan</span></h1>
      </div>
      <a class="akashic-404__cta" href="{{ url_for('index') }}">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 9H2M7 4L2 9l5 5"/></svg>
        Kembali ke Akashic
      </a>
    </section>
  </main>

  <footer class="akashic-404__footer" aria-hidden="true">
    <div class="akashic-404__footer-row">
      <p>DOCUMENT / <b>404</b><br>LOCATION / <b>UNKNOWN</b></p>
      <p>STATUS / <b>NOT FOUND</b><br>EST. 2026</p>
    </div>
  </footer>
</div>

<script>
"use strict";

/* Ubah ke true agar parallax, animasi, dan video tetap berjalan walau OS meminta reduced motion. */
const FORCE_MOTION = false;

document.addEventListener("DOMContentLoaded", () => {
  const root = document.getElementById("akashic404");
  if (!root) return;
  const video = root.querySelector(".akashic-404__video");
  const mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  const state = { motion: FORCE_MOTION || !(mq && mq.matches), tx: 0, ty: 0, cx: 0, cy: 0, raf: 0 };
  const play = () => { const p = video.play(); if (p && p.catch) p.catch(() => {}); };

  if (FORCE_MOTION) root.classList.add("akashic-404--force");

  /* Video + fallback */
  if (video) {
    const showVideo = () => root.classList.add("akashic-404--video");
    const useFallback = () => {
      root.classList.remove("akashic-404--video");
      root.classList.add("akashic-404--novideo");
      try { video.pause(); } catch (_) {}
    };
    video.addEventListener("loadeddata", () => { showVideo(); if (!state.motion) video.pause(); });
    video.addEventListener("error", useFallback);
    const source = video.querySelector("source");
    if (source) source.addEventListener("error", useFallback);
    if (video.readyState >= 2) showVideo();
    if (state.motion) play(); else video.removeAttribute("autoplay");
  }

  /* Parallax pointer (lerp, loop hanya saat bergerak) */
  function step() {
    state.cx += (state.tx - state.cx) * 0.07;
    state.cy += (state.ty - state.cy) * 0.07;
    root.style.setProperty("--a4-mx", state.cx.toFixed(3));
    root.style.setProperty("--a4-my", state.cy.toFixed(3));
    const moving = Math.abs(state.tx - state.cx) + Math.abs(state.ty - state.cy) > 0.002;
    state.raf = moving && document.visibilityState === "visible" ? requestAnimationFrame(step) : 0;
  }
  const fine = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  if (state.motion && fine) {
    window.addEventListener("pointermove", (e) => {
      if (window.innerWidth < 768 || (e.pointerType && e.pointerType !== "mouse")) return;
      state.tx = (e.clientX / window.innerWidth - 0.5) * 2;
      state.ty = (e.clientY / window.innerHeight - 0.5) * 2;
      if (!state.raf && document.visibilityState === "visible") state.raf = requestAnimationFrame(step);
    }, { passive: true });
  }

  /* Visibility */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      if (state.raf) { cancelAnimationFrame(state.raf); state.raf = 0; }
      if (video) video.pause();
    } else if (state.motion && video && !root.classList.contains("akashic-404--novideo")) {
      play();
    }
  });
});
</script>
</body>
</html>
